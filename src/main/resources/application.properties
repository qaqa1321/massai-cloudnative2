# ===== Lab B : 클라우드 네이티브 방식 =====
# 환경마다 달라지는 값은 모두 환경변수에서 읽습니다. (${변수명:기본값})
# 환경변수가 없으면 기본값을 쓰므로 로컬(./mvnw spring-boot:run)에서도 그대로 실행됩니다.
spring.application.name=massai-mara-park
server.port=8080
app.title=${APP_TITLE:Massai Mara Wildlife Reserve}
# 이미지에 구워 넣은 버전(Dockerfile의 APP_VERSION). 로컬 실행 시 기본값 dev
app.version=${APP_VERSION:dev}

# DB 주소와 계정은 코드가 아니라 환경변수로 주입합니다 (docker-compose.yml 참고)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:massai}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# H2 콘솔은 운영 환경에서 꺼 둡니다 (기본 false)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# 종료 신호(SIGTERM)를 받으면 진행 중인 요청을 마치고 종료합니다
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# 헬스체크 : /actuator/health/liveness , /actuator/health/readiness
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
