# CI/CD 입문: 테스트 → 이미지 빌드 → Docker Hub 푸시
name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # 1) 모든 push와 pull request에서 실행: 테스트가 실패하면 여기서 멈춥니다
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v4

      - name: JDK 21 설치 (Maven 캐시 포함)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 빌드와 테스트
        run: |
          chmod +x mvnw      # Windows에서 올린 파일은 실행 권한이 빠질 수 있습니다
          ./mvnw -B verify

  # 2) 테스트가 통과한 push에서만 실행: 이미지를 만들어 Docker Hub에 올립니다
  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v4

      - name: 이미지에 넣을 버전 계산 (v1.0.2-abc1234 또는 main-abc1234 형식)
        id: version
        run: echo "app_version=${GITHUB_REF_NAME}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Docker Buildx 준비
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub 로그인 (토큰 사용)
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 이미지 태그 규칙 정하기
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/massai-mara-park
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 빌드하고 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
