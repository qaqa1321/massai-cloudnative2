<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Massai Mara</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div class="container">
    <h4 th:text="${animal.description}">animal</h4>
    <img th:src="'/' + ${animal.url}" th:alt="${animal.description}">
    <p>조회 수: <strong th:text="${animal.viewCount}">0</strong></p>
    <form method="post" th:action="@{/animals/{id}/view(id=${animal.id})}">
        <button type="submit">조회 수 +1</button>
    </form>
    <p><a href="/">다른 동물 구경하기</a></p>
    <p><small>Served by <span th:text="${hostname}">host</span>:<span th:text="${port}">8080</span></small></p>
    <p><small>App version <span th:text="${version}">dev</span></small></p>
    <p><small>Photo taken at <a href="https://www.maasaimara.com/">Maasai Mara</a></small></p>
</div>
</body>
</html>
