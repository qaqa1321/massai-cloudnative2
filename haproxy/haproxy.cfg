# HAProxy 설정 : app 서비스의 모든 컨테이너를 Docker DNS로 찾아 라운드로빈합니다.
# 컨테이너가 늘거나 바뀌어도 설정을 고칠 필요가 없습니다 (서비스 디스커버리).
global
    maxconn 1024

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      2s

frontend http_in
    bind *:8080
    default_backend massai

backend massai
    balance roundrobin
    option httpchk GET /actuator/health/readiness
    server-template app 10 app:8080 check resolvers docker init-addr none
